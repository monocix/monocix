services:
  postgres:
    image: postgres:17-alpine
    container_name: monocix-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monocix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/monocix-api/db/schema/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./apps/monocix-api/db/seeds/dev.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monocix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
